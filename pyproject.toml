[project]
name = "cloudfinderweb"
version = "0.2.0"
description = "A web application to check if an IP address belongs to a cloud provider."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "flask[async]>=3.0.0",
    "gunicorn>=23.0.0",
    "jinja2>=3.1.0",
    "ipaddress>=1.0.0",
    "bs4>=0.0.2",
    "asgiref>=3.7.0",
    "filelock>=3.19.1",
    "fastmcp>=3.4.3",
]

[project.scripts]
cloudfinderweb = "cloudfinderweb.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloudfinderweb*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
